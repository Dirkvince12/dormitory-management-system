kind = "web"
previewPath = "/"
title = "Dormitory Management System"
version = "1.0.0"
id = "artifacts/dorm-management"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23697

[services.development]
run = "pnpm --filter @workspace/dorm-management run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dorm-management", "run", "build" ]
publicDir = "artifacts/dorm-management/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23697"
BASE_PATH = "/"
